# Nixpacks configuration for Railway
[phases.setup]
nixPkgs = ["python311", "ffmpeg", "libGL", "mesa"]

[phases.install]
cmds = ["pip install --upgrade pip", "pip install -r requirements.txt"]

[start]
cmd = "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 300 --limit-request-field_size 32768"
